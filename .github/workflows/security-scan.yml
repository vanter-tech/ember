name: Dependency Security Scan

# Avisa de dependencias con vulnerabilidades conocidas. No es un status check requerido del
# ruleset "EMBER - PROTECTION": un hallazgo se ve en rojo pero no bloquea el merge.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 13 * * 1"

jobs:
  audit-frontend:
    name: audit-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (produccion, severidad alta o critica)
        run: pnpm audit --prod --audit-level high

  audit-backend:
    name: audit-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Cache de la base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # Sin NVD_API_KEY (secreto del repo, gratis en nvd.nist.gov) la descarga inicial es lenta
      # y puede fallar por rate limit.
      - name: OWASP dependency-check (falla con CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B org.owasp:dependency-check-maven:check -f ./backend/pom.xml
          -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY" -Dformat=HTML
      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
