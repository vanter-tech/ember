name: Monorepo Linting CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-backend:
    name: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Ejecutar Checkstyle
        run: mvn checkstyle:check -f ./backend/pom.xml

  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Ejecutar ESLint
        run: pnpm run lint

  # No hay módulo gateway todavía (EMB-GATEWAY sin empezar). Este job existe solo para
  # satisfacer el status check `lint-gateway` que el ruleset "EMBER - PROTECTION" exige;
  # cuando exista un gateway/ real, reemplazar el cuerpo por su lint.
  lint-gateway:
    name: lint-gateway
    runs-on: ubuntu-latest
    steps:
      - run: echo "sin módulo gateway; nada que lintear todavía"
