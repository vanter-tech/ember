name: Monorepo Linting CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-backend:
    name: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Ejecutar Checkstyle
        run: mvn checkstyle:check -f ./backend/pom.xml

  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Ejecutar ESLint
        run: pnpm run lint

  # No hay módulo gateway todavía (EMB-GATEWAY sin empezar). Este job existe solo para
  # satisfacer el status check `lint-gateway` que el ruleset "EMBER - PROTECTION" exige;
  # cuando exista un gateway/ real, reemplazar el cuerpo por su lint.
  lint-gateway:
    name: lint-gateway
    runs-on: ubuntu-latest
    steps:
      - run: echo "sin módulo gateway; nada que lintear todavía"

  # El frontend tiene dos variantes de build: la Cloud (base "/") y la del Hub on-prem
  # (base "/app/", VITE_HUB_BUILD=true, sin subsistema de cliente). CI compilaba solo la
  # Cloud; este job asegura que la del Hub también type-checkea, bundlea y pasa los tests.
  build-hub:
    name: build-hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Build del Hub (base /app/, modo hub)
        run: pnpm run build:hub
      - name: Tests
        run: pnpm run test:run

  # El print-agent (printing-agent/, com.vanter.emberagent) corre headless como sidecar de
  # un shell Tauri (printing-agent/src-tauri, ventana Astro+React en printing-agent/ui).
  # Este job compila el fat jar, la app-image jpackage/jlink, la UI, y el instalador NSIS
  # via el bundler de Tauri (reemplaza Inno Setup).
  build-print-agent:
    name: build-print-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Empaquetar el fat jar del agente
        run: mvn -f printing-agent/pom.xml -q -B -DskipTests package
      - name: jlink + jpackage app-image
        run: pwsh printing-agent/build-installer.ps1 -Stage appimage
      - name: Verificar que el lanzador existe
        run: if (-not (Test-Path "printing-agent/dist/app-image/Ember Agent/Ember Agent.exe")) { exit 1 }
      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ./printing-agent/ui/pnpm-lock.yaml
      - name: Instalar dependencias y compilar la UI del agente
        run: |
          cd printing-agent/ui
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run build
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
      # Sin cache, tauri-cli y las dependencias de Tauri se compilan desde cero en cada PR (~15 min).
      - name: Cache de cargo (registry, target y binarios instalados)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: printing-agent/src-tauri
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: cargo tauri build (release + instalador NSIS)
        run: |
          cd printing-agent/src-tauri
          cargo tauri build
      - name: Verificar que el instalador existe
        run: if (-not (Get-ChildItem "printing-agent/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe")) { exit 1 }
