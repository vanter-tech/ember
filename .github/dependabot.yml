version: 2

# Major bumps are deliberately ignored: they are migrations (Spring Boot 4, vitest 5, oshi 7,
# minio 9...) that need their own task and tests, not a bot PR. Security updates are separate
# from these version-update rules and still open for ignored packages.
# `package-ecosystem: npm` is Dependabot's name for the whole JS ecosystem; it reads the
# pnpm-lock.yaml in each directory and updates it with pnpm.
updates:
  - package-ecosystem: maven
    directories: ["/backend", "/printing-agent"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 8.6.0 pulls okhttp 5, whose classes are not on the compile classpath under Maven
      # (MinioConfig fails with "class file for okhttp3.HttpUrl not found"). Revisit by hand.
      - dependency-name: "io.minio:minio"
        update-types: ["version-update:semver-minor"]
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories: ["/frontend", "/landing", "/ember-hub/ui", "/printing-agent/ui"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directories: ["/ember-hub/src-tauri", "/printing-agent/src-tauri"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
