version: 2
updates:
  - package-ecosystem: maven
    directories: ["/backend", "/printing-agent"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directories: ["/frontend", "/landing", "/ember-hub/ui", "/printing-agent/ui"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directories: ["/ember-hub/src-tauri", "/printing-agent/src-tauri"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
