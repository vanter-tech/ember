<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Relative (not "/env-config.js"): Vite doesn't rewrite plain <script src> refs for
         --base, so an absolute path would ignore --base=/app/ (used by the Hub build) and
         request it from the server root instead of alongside index.html. The Cloudflare Pages
         build (served from root) rewrites this to "/env-config.js" in scripts/gen-env-config.mjs
         so deep links don't hit the SPA fallback for "/<route>/env-config.js". -->
    <script src="env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
