name: ember-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ember
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set in /opt/ember/.env}
    volumes:
      - ember_pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/vanter-tech/ember-backend:${EMBER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - /opt/ember/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1536m"
    ports:
      - "127.0.0.1:8081:8081"   # actuator/management — loopback only, for the Ops Agent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in /opt/ember/.env}
    depends_on:
      - app

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ember
      PGPASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set in /opt/ember/.env}
      PGDATABASE: ember
      GCS_BUCKET: ${BACKUP_GCS_BUCKET:?set in /opt/ember/.env}
      DAILY_RETENTION: "14"
      WEEKLY_RETENTION: "8"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ember_pgdata:
