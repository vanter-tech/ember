# H2 in-memory database for tests (replaces PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Migrations are PostgreSQL-specific; the H2 test schema is generated from the entities instead.
spring.flyway.enabled=false

# Spring Data MongoDB URI for embedded instance (flapdoodle overrides host/port at runtime)
spring.data.mongodb.uri=mongodb://localhost:27017/ember-test

# JWT
jwt.secret=ember-secret-key-must-be-at-least-32-characters-long-for-hs256
jwt.expiration-ms=3600000

# MinIO (required by properties binding, not used in tests)
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=ember-media

# Embedded MongoDB version for @DataMongoTest (flapdoodle)
de.flapdoodle.mongodb.embedded.version=7.0.2
