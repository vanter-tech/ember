spring:
  # Secrets live in the gitignored root `.env` (see `.env.example` for the key list), never here.
  # Both paths are optional so the jar/container (which gets real env vars) boots without the file.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      # Per-developer overrides (also gitignored) — last import wins, so this beats `.env`.
      # Useful when `.env` holds the docker-compose hostnames but you run the app on the host.
      - optional:file:./.env.local[.properties]
      - optional:file:../.env.local[.properties]
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: ember

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ember}
    username: ${SPRING_DATASOURCE_USERNAME:ember}
    # No fallback: booting on a shipped default password is worse than failing to boot.
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # The schema predates Flyway (it was built by ddl-auto), so the existing state is adopted as V1
    # and versioned migrations start at V2.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    mongodb:
      # No fallback: the URI embeds the Mongo credentials.
      uri: ${SPRING_DATA_MONGODB_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ember-saas

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:ember-media}

server:
  servlet:
    context-path: /v1/
