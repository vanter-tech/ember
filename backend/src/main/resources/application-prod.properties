spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

platform.jwt.secret=${PLATFORM_JWT_SECRET}
platform.jwt.expiration-ms=${PLATFORM_JWT_EXPIRATION_MS:86400000}

# Object storage is Google Cloud Storage via its S3-compatible XML API (HPD-16).
# MINIO_URL=https://storage.googleapis.com, credentials are a GCS HMAC key. The bucket
# and its allUsers:objectViewer binding are provisioned by the operator, so the app must
# not try to create it or push an S3 bucket policy (GCS rejects PutBucketPolicy).
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:ember-media}
minio.manage-bucket=${MINIO_MANAGE_BUCKET:false}

# Behind the Cloudflare Tunnel: trust X-Forwarded-* for scheme/host reconstruction.
server.forward-headers-strategy=framework

# Actuator on its own port. The prod compose publishes this on 127.0.0.1 only, so it is
# reachable by the on-VM Ops Agent (metrics scrape) but never via the Tunnel or the LAN.
management.server.port=8081
management.endpoint.health.show-details=never
