spring:
  datasource:
    url: jdbc:postgresql://localhost:${EMBER_HUB_POSTGRES_PORT:5432}/ember
    username: ember
    password: ember
  jpa:
    hibernate:
      ddl-auto: validate

ember:
  hub:
    heartbeat-interval-ms: ${EMBER_HUB_HEARTBEAT_INTERVAL_MS:300000}

minio:
  url: http://127.0.0.1:${EMBER_HUB_MINIO_PORT:9000}
  access-key: ember-hub
  secret-key: ember-hub-local
  bucket: ember-media

server:
  port: ${EMBER_HUB_SERVER_PORT:8080}
  servlet:
    # Overrides application.yml's "/v1/". The Hub is a single origin that serves BOTH the
    # tenant API (at "/", e.g. /hub-activations, /kitchen/orders) and the bundled SPA (at
    # "/app/", see HubWebConfig). Keeping the API at the root avoids a "/v1" prefix the LAN
    # terminals and the launcher's health checks would otherwise have to know about;
    # HubSpaRootController redirects "/" -> "/app/" so the bare host lands on the SPA.
    context-path: /
