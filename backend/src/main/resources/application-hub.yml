spring:
  datasource:
    url: jdbc:postgresql://localhost:${EMBER_HUB_POSTGRES_PORT:5432}/ember
    username: ember
    # F-21: a fresh install gets a random value in hub.env (see PortableDatabaseBootstrap's
    # javadoc); this literal is only a fallback for an install from before that existed.
    password: ${EMBER_HUB_POSTGRES_PASSWORD:ember}
  jpa:
    hibernate:
      ddl-auto: validate

ember:
  plans:
    # Hub = paid on-premise license; its restaurant is seeded as FREE, so SaaS plan gates
    # (branding, table count, ...) would 402 the onboarding wizard. See PlanGateService.
    enforced: false
  deployment-mode:
    # Inside the Hub its own restaurant is HUB and must keep working; the "closed to Web" gates
    # only make sense in the cloud. See DeploymentMode.isClosedToWeb.
    enforced: false
  hub:
    heartbeat-interval-ms: ${EMBER_HUB_HEARTBEAT_INTERVAL_MS:300000}
  printing:
    # Each caja PC runs its own print agent; a receipt goes to the agent connected from the
    # requester's LAN address (see PrintTargetResolver). Meaningless behind the cloud's proxies.
    route-by-source-ip: true

minio:
  url: http://127.0.0.1:${EMBER_HUB_MINIO_PORT:9000}
  access-key: ember-hub
  # F-21: a fresh install gets a random value in hub.env; this literal is only a fallback for
  # an install from before that existed.
  secret-key: ${EMBER_HUB_MINIO_SECRET_KEY:ember-hub-local}
  bucket: ember-media

server:
  port: ${EMBER_HUB_SERVER_PORT:8080}
  servlet:
    # Overrides application.yml's "/v1/". The Hub is a single origin that serves BOTH the
    # tenant API (at "/", e.g. /hub-activations, /kitchen/orders) and the bundled SPA (at
    # "/app/", see HubWebConfig). Keeping the API at the root avoids a "/v1" prefix the LAN
    # terminals and the launcher's health checks would otherwise have to know about;
    # HubSpaRootController redirects "/" -> "/app/" so the bare host lands on the SPA.
    context-path: /
