spring:
  datasource:
    url: jdbc:postgresql://localhost:${EMBER_HUB_POSTGRES_PORT:5432}/ember
    username: ember
    password: ember
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${EMBER_HUB_SERVER_PORT:8080}
  servlet:
    # Overrides application.yml's "/v1/" — the bundled frontend's built assets reference
    # absolute root paths (/assets/..., /env-config.js), so hub serves everything at "/" instead
    # of splitting API and static content across two prefixes.
    context-path: /
